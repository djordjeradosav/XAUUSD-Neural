[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-neural"
version = "0.1.0"
description = "LSTM / gradient-boosting signals for XAUUSD with fixed 1:2 risk:reward trades"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
notebooks = ["tensorflow>=2.15", "matplotlib>=3.7", "joblib>=1.3", "jupyter"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["xauusd_neural"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
